<head>
    <style>
        #logo {
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.075s ease-in-out;
        }
        #logo:hover {
            transform: scale(1.1);
        }
    </style>
</head>

<header class="site-header">
   <!-- <div class="header">
    <a href="https://warreadriaensen.github.io/"> <img id="logo" src="favicon.ico" alt="Click to go this blogs homepage" width="50" height="50"> </a>
  <h3 class="site-title"><a href="{{ site.github.url }}/">{{ site.title }}</a></h3>
    </div> -->
    <img style="display: inline;" src="favicon.ico" alt="logo" width="50" height="50"/>
<h1 style="display: inline;">My website name</h1>
  <nav class="menu-list">
    {% for item in site.data.settings.menu %}
      <a href="{{ site.github.url }}/{{ item.url }}" class="menu-link">{{ item.name }}</a>
    {% endfor %}
    {% for item in site.data.settings.social %}
      <a href="{{ item.link }}" class="menu-link" target="_blank"><i class="fa fa-{{ item.icon }}" aria-hidden="true"></i></a>
    {% endfor %}
  </nav>
  <div class="dropdown">
    <button class="dropbtn"><i class="fa fa-bars" aria-hidden="true"></i></button>
    <div class="dropdown-content">
      {% for item in site.data.settings.menu %}
        <a href="{{ site.github.url }}/{{ item.url }}" class="menu-link">{{ item.name }}</a>
      {% endfor %}
      {% for item in site.data.settings.social %}
        <a href="{{ item.link }}" class="menu-link" target="_blank"><i class="fa fa-{{ item.icon }}" aria-hidden="true"></i></a>
      {% endfor %}
    </div>
  </div>
</header>
